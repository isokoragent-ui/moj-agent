<!doctype html>
<html lang="no"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f1e8;--forest:#24402e;--green:#7fae2e;--blue:#7fb3dc;--ink:#1f2a22;--muted:#6f7568;--red:#c8402b}
body{width:210mm;height:297mm;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink);position:relative;overflow:hidden}
.head{padding:14mm 14mm 0;display:flex;justify-content:space-between;align-items:center;font-size:9.5pt;letter-spacing:.32em;font-weight:600;color:var(--forest)}
.head .logo{display:flex;align-items:center;gap:2.5mm}
.rule{height:.35mm;background:var(--forest);opacity:.25;margin:5mm 14mm 0}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:72pt;line-height:.95;color:var(--forest);padding:9mm 14mm 0;letter-spacing:-.01em}
.lead{font-family:'Fraunces',serif;font-weight:500;font-size:19pt;color:var(--forest);padding:3mm 14mm 0;opacity:.85}
.stage{position:absolute;left:0;right:0;top:80mm;height:160mm}
.arch{position:absolute;left:14mm;top:6mm;width:112mm;height:141mm;background:#e8e2d3;border-radius:56mm 56mm 0 0}
.shadow{position:absolute;top:143mm;height:7mm;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.28),rgba(0,0,0,0) 70%)}
.bottle{position:absolute;bottom:11mm}
.b1{left:13mm;height:142mm}
.b2{left:58mm;height:142mm}
.price{position:absolute;right:12mm;top:28mm;width:68mm;height:68mm;border-radius:50%;background:var(--forest);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 2mm 6mm rgba(0,0,0,.18)}
.price .l{font-size:10pt;letter-spacing:.28em;font-weight:600;opacity:.85}
.price .a{font-family:'Fraunces',serif;font-weight:700;font-size:62pt;line-height:1;margin-top:1mm}
.price .a span{font-size:34pt}
.price .s{font-size:9.5pt;letter-spacing:.2em;font-weight:600;margin-top:1mm;opacity:.85}
.was{position:absolute;right:12mm;top:101mm;width:68mm;text-align:center;font-size:11pt;color:var(--muted)}
.was s{font-weight:600;font-size:15pt;color:var(--ink);text-decoration-color:var(--red);text-decoration-thickness:.4mm}
.save{display:inline-block;margin-top:3mm;background:var(--green);color:#fff;font-weight:800;font-size:12pt;letter-spacing:.12em;padding:1.8mm 5mm;border-radius:10mm}
.names{position:absolute;right:12mm;top:126mm;width:68mm;font-size:10.5pt;line-height:1.45}
.names div{display:flex;gap:2.5mm;align-items:baseline;margin-top:2.5mm}
.names i{flex:none;width:2.6mm;height:2.6mm;border-radius:50%;display:inline-block;transform:translateY(.2mm)}
.names b{font-weight:600}
.names span{color:var(--muted)}
.foot{position:absolute;left:14mm;right:14mm;bottom:12mm}
.eco{display:flex;justify-content:space-between;font-size:10pt;letter-spacing:.24em;font-weight:600;color:var(--forest);border-top:.35mm solid rgba(36,64,46,.25);padding-top:5mm}
.only{margin-top:6mm;display:flex;justify-content:space-between;align-items:center}
.only b{font-family:'Fraunces',serif;font-weight:700;font-size:21pt;color:var(--forest)}
.only span{font-size:9.5pt;letter-spacing:.2em;color:var(--muted)}
</style></head><body>
<div class="head">
  <div class="logo"><svg width="18" height="18" viewBox="0 0 100 100" fill="none" stroke="#24402e" stroke-width="5"><polygon points="50,4 90,27 90,73 50,96 10,73 10,27"/><polygon points="50,24 72,37 72,63 50,76 28,63 28,37"/><path d="M50 4V24M90 27 72 37M90 73 72 63M50 96V76M10 73 28 63M10 27 28 37"/></svg>ISOKOR</div>
  <div>KUN PÅ MESSEN</div>
</div>
<div class="rule"></div>
<h1>Messekupp</h1>
<div class="lead">Rent kjøkken – med god samvittighet.</div>

<div class="stage">
  <div class="arch"></div>
  <div class="shadow" style="left:15mm;width:48mm"></div>
  <div class="shadow" style="left:60mm;width:48mm"></div>
  <img class="bottle b1" src="cleaner_cut.png" alt="Isokor Cleaner">
  <img class="bottle b2" src="fridge_cut.png" alt="Isokor Fridge Cleaner">

  <div class="price">
    <div class="l">BEGGE FOR</div>
    <div class="a">249<span>,-</span></div>
    <div class="s">MESSEPRIS</div>
  </div>
  <div class="was">Ordinær pris &nbsp;<s>398 kr</s><br><span class="save">SPAR 149,-</span></div>
  <div class="names">
    <div><i style="background:var(--green)"></i><p><b>Cleaner</b><br><span>Fett- og flekkfjerner · 500 ml</span></p></div>
    <div><i style="background:var(--blue)"></i><p><b>Fridge Cleaner</b><br><span>Kjøleskapsrens · 500 ml</span></p></div>
  </div>
</div>

<div class="foot">
  <div class="eco"><span>ØKOLOGISK</span><span>NATURLIG</span><span>BIOLOGISK NEDBRYTBAR</span></div>
  <div class="only"><b>Kun på messen.</b><span>ISOKOR-SKANDINAVIA.NO</span></div>
</div>
</body></html>
