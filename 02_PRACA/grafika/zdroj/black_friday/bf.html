<!doctype html>
<html lang="no"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Assistant:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:1000px;background:#142a1f;font-family:Assistant,sans-serif;color:#f6f5f0;overflow:hidden}
.w{position:relative;width:1200px;height:1000px;padding:80px 84px;background:radial-gradient(circle at 78% 60%,#1f4d36 0,#142a1f 62%)}
.eye{font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#e7c987;font-size:30px}

.sub{font-size:44px;font-weight:700;margin-top:6px;max-width:600px;line-height:1.15}
.note{font-size:28px;color:#cfdcd2;margin-top:22px;max-width:560px;line-height:1.3}
.foot{position:absolute;left:84px;bottom:64px;font-size:28px;font-weight:700;color:#e7c987;letter-spacing:.04em}
.b{position:absolute;bottom:40px;filter:drop-shadow(0 24px 30px rgba(0,0,0,.45))}
.b1{height:470px;right:290px;bottom:70px}
.b2{height:560px;right:140px;bottom:50px}
.b3{height:450px;right:20px;bottom:75px}
.tag{position:absolute;right:80px;top:80px;border:3px solid #e7c987;color:#e7c987;border-radius:999px;padding:12px 30px;font-size:30px;font-weight:800}
</style></head><body><div class="w">
<div class="eye">Black Friday · kun for våre kunder</div>

<div class="pct">15<small> %</small></div>
<div class="sub">på alle enkeltprodukter</div>
<div class="note">Rabatten legges inn automatisk i handlekurven. Gjelder ikke pakker og sett.</div>
<div class="foot">isokor-skandinavia.no</div>
<div class="tag" id="t">Kun én dag</div>
<img class="b b1" src="lm.png"><img class="b b2" src="flaska_sofarens.png"><img class="b b3" src="bath_fix.png">
</div><script>if(location.search.includes("paminnelse")){h.innerHTML="Bare i dag<br>til midnatt";t.textContent="Siste sjanse"}</script></body></html>
