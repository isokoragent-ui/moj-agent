<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=block" rel="stylesheet">
<style>
  /* verzia na šírku 1920×1080: texty v ľavom krémovom paneli (800 px) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .t { position: absolute; left: 0; width: 800px; text-align: center; display: none; color: #1f3a2b; }
  .kick { font-family: "Jost"; font-weight: 500; font-size: 24px; letter-spacing: .42em; text-transform: uppercase; color: #7a5a24; }
  .rule { width: 80px; height: 2px; margin: 26px auto; background: #9a7737; }
  .serif { font-family: "Cormorant Garamond", serif; font-weight: 500; line-height: 1.05; }
  em { font-style: italic; }
  .small { font-family: Jost; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: #3f5246; margin-top: 30px; line-height: 1.7; }
</style>
</head>
<body>
<div id="t1" class="t" style="top:345px">
  <div class="kick">Isokor EcoNeutral</div><div class="rule"></div>
  <div class="serif" style="font-size:96px">Frisk luft –<br><em>også inne</em></div>
</div>
<div id="t2" class="t" style="top:345px">
  <div class="kick">Dermatologisk testet</div><div class="rule"></div>
  <div class="serif" style="font-size:80px">Trygg for både<br><em>mennesker og dyr</em></div>
</div>
<div id="t3" class="t" style="top:355px">
  <div class="kick">Nøytraliserer lukt</div><div class="rule"></div>
  <div class="serif" style="font-size:70px"><em>Sko, tepper, madrasser<br>og bilinteriør</em></div>
</div>
<div id="t4" class="t" style="top:420px">
  <div class="serif" style="font-size:90px">Etterlater en<br><em>frisk duft</em></div>
</div>
<div id="t6" class="t" style="top:280px">
  <div class="kick">Isokor</div><div class="rule"></div>
  <div class="serif" style="font-size:92px">EcoNeutral</div>
  <div class="serif" style="font-size:52px;margin-top:4px"><em>Lukt- og flekkfjerner</em></div>
  <div class="small">Naturlig · Miljøvennlig<br>Biologisk nedbrytbar</div>
</div>
<div id="t7" class="t" style="top:870px">
  <div class="serif" style="font-size:40px"><em>isokor-skandinavia.no</em></div>
</div>
</body>
</html>
