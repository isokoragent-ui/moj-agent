<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  .t { position: absolute; left: 0; right: 0; text-align: center; display: none; }
  .kick { font-family: "Jost"; font-weight: 500; font-size: 27px; letter-spacing: .42em; text-transform: uppercase; }
  .rule { width: 90px; height: 2px; margin: 24px auto; }
  .serif { font-family: "Cormorant Garamond", serif; font-weight: 500; line-height: 1.04; }
  em { font-style: italic; }
  .dark { color: #1f3a2b; text-shadow: 0 0 24px rgba(250,244,232,.85), 0 0 6px rgba(250,244,232,.6); }
  .dark .kick { color: #7a5a24; } .dark .rule { background: #9a7737; }
  .light { color: #fbf6ec; text-shadow: 0 2px 26px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.35); }
  .light .kick { color: #f1dfb6; } .light .rule { background: #f1dfb6; }
</style>
</head>
<body>
<div id="t1" class="t dark" style="top:440px">
  <div class="kick">Isokor EcoNeutral</div><div class="rule"></div>
  <div class="serif" style="font-size:98px">Frisk luft –<br><em>også inne</em></div>
</div>
<div id="t2" class="t dark" style="top:250px">
  <div class="kick">Dermatologisk testet</div><div class="rule"></div>
  <div class="serif" style="font-size:88px">Trygg for både<br><em>mennesker og dyr</em></div>
</div>
<div id="t3" class="t dark" style="top:250px">
  <div class="kick">Nøytraliserer lukt</div><div class="rule"></div>
  <div class="serif" style="font-size:80px"><em>Sko, tepper, madrasser<br>og bilinteriør</em></div>
</div>
<div id="t4" class="t dark" style="top:200px">
  <div class="serif" style="font-size:92px">Etterlater en<br><em>frisk duft</em></div>
</div>
<div id="t6" class="t dark" style="top:150px">
  <div class="kick">Isokor</div><div class="rule"></div>
  <div class="serif" style="font-size:104px">EcoNeutral</div>
  <div class="serif" style="font-size:58px;margin-top:4px"><em>Lukt- og flekkfjerner</em></div>
  <div style="font-family:Jost;margin-top:26px;font-size:25px;letter-spacing:.2em;text-transform:uppercase;color:#3f5246">Naturlig · Miljøvennlig · Biologisk nedbrytbar</div>
</div>
<div id="t7" class="t dark" style="top:1790px">
  <div class="serif" style="font-size:46px"><em>isokor-skandinavia.no</em></div>
</div>
</body>
</html>
