<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #eef3ec;
    --ink: #1c2b22;
    --muted: #4f6357;
    --green: #2f6b4a;
    --green-deep: #1f4d36;
    --card: #ffffff;
    --line: #cfdcd2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font-family: "Assistant", "Inter", sans-serif; color: var(--ink); }
  .wrap { width: var(--w); height: var(--h); padding: var(--pad); display: flex; flex-direction: column; justify-content: center; gap: var(--gap); position: relative; overflow: hidden; }
  .leaf { position: absolute; right: -4%; top: -18%; width: 34%; opacity: .07; }
  .eyebrow { font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--green); font-size: var(--eyebrow); }
  h1 { font-weight: 800; font-size: var(--h1); line-height: 1.02; letter-spacing: -.01em; }
  .tiers { display: grid; grid-template-columns: var(--cols); gap: var(--tgap); }
  .tier { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: var(--tpad); display: flex; flex-direction: column; gap: .35em; }
  .tier .when { font-size: var(--when); color: var(--muted); font-weight: 600; }
  .tier .price { font-size: var(--price); font-weight: 800; line-height: 1; color: var(--ink); }
  .tier .note { font-size: var(--note); font-weight: 700; color: var(--green); }
  .tier.free { background: var(--green-deep); border-color: var(--green-deep); }
  .tier.free .when { color: #cfe3d6; }
  .tier.free .price, .tier.free .note { color: #ffffff; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; font-size: var(--foot); color: var(--muted); font-weight: 600; flex-wrap: wrap; }
  .foot b { color: var(--ink); font-weight: 800; }

  body.banner { --w: 2000px; --h: 640px; --pad: 64px 96px; --gap: 34px; --eyebrow: 26px; --h1: 76px; --cols: 1fr 1fr 1fr; --tgap: 28px; --tpad: 30px 36px; --when: 30px; --price: 76px; --note: 26px; --foot: 26px; }
  body.square { --w: 1080px; --h: 1080px; --pad: 84px 80px; --gap: 40px; --eyebrow: 26px; --h1: 84px; --cols: 1fr; --tgap: 20px; --tpad: 26px 34px; --when: 32px; --price: 64px; --note: 26px; --foot: 26px; }
  body.square .tier { flex-direction: row; align-items: center; justify-content: space-between; }
  body.square .tier .txt { display: flex; flex-direction: column; gap: 4px; }
  body.mobile { --w: 1080px; --h: 1350px; --pad: 96px 80px; --gap: 48px; --eyebrow: 28px; --h1: 92px; --cols: 1fr; --tgap: 24px; --tpad: 34px 38px; --when: 34px; --price: 72px; --note: 28px; --foot: 28px; }
  body.mobile .tier { flex-direction: row; align-items: center; justify-content: space-between; }
  body.mobile .tier .txt { display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="leaf" viewBox="0 0 100 100" aria-hidden="true"><path fill="#1f4d36" d="M90 8C48 6 14 30 12 70c-.5 9 2 16 5 22 4-20 18-40 40-52-18 16-30 34-34 56 6 2 12 3 19 2 38-6 52-46 48-90z"/></svg>
  <div class="eyebrow">Frakt i hele Norge</div>
  <h1>Jo mer du handler, jo billigere frakt</h1>
  <div class="tiers">
    <div class="tier"><div class="txt"><div class="when">Under 400 kr</div><div class="note">Standard frakt</div></div><div class="price">99 kr</div></div>
    <div class="tier"><div class="txt"><div class="when">Fra 400 kr</div><div class="note">Halv frakt</div></div><div class="price">49 kr</div></div>
    <div class="tier free"><div class="txt"><div class="when">Fra 700 kr</div><div class="note">Gratis frakt</div></div><div class="price">0 kr</div></div>
  </div>
  <div class="foot"><span>Sendes med PostNord · Alle priser inkl. mva</span><b>isokor-skandinavia.no</b></div>
</div>
<script>document.body.className = new URLSearchParams(location.search).get('f') || 'banner';</script>
</body>
</html>
