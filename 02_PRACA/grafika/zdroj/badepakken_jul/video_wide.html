<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=block" rel="stylesheet">
<style>
  :root { --pine:#0f3326; --pine-2:#1a4a37; --gold:#d9b56b; --gold-soft:#f0dcae; --snow:#f7f4ec; --ink:#10251c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--pine); }
  body { font-family: "Assistant", sans-serif; color: var(--snow); }
  .layer { position: absolute; inset: 0; }
  .bg { background: radial-gradient(90% 110% at 60% 50%, var(--pine-2) 0%, var(--pine) 70%); }

  /* scenes 1–2: photo panel left, text right */
  #ph { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .panel { position: absolute; left: 110px; top: 90px; width: 720px; height: 900px; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.45); border: 4px solid rgba(247,244,236,.9); }
  .panel .photo { position: absolute; inset: 0; overflow: hidden; }
  .panel img { width: 100%; height: 100%; object-fit: cover; transform-origin: 55% 50%; }
  .tag { position: absolute; left: 26px; top: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 34px; padding: 8px 24px; border-radius: 999px; background: var(--snow); color: var(--ink); }
  .tag.gold { background: var(--gold); }
  .q { position: absolute; left: 960px; right: 110px; top: 50%; transform: translateY(-50%); font-family: "Fraunces", serif; font-weight: 700; font-size: 118px; line-height: 1.02; }
  .q em { font-style: normal; color: var(--gold-soft); }

  /* scene 3 */
  .eyebrow { position: absolute; left: 120px; top: 170px; color: var(--gold); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; font-size: 30px; }
  .title { position: absolute; left: 120px; top: 225px; width: 860px; font-family: "Fraunces", serif; font-weight: 700; font-size: 112px; line-height: 1.02; }
  .title em { font-style: normal; color: var(--gold-soft); }
  .save { position: absolute; left: 120px; top: 640px; font-size: 40px; font-weight: 700; color: #cfe0d6; }
  .save b { color: var(--gold-soft); }
  .cta { position: absolute; left: 120px; top: 730px; white-space: nowrap; background: var(--snow); color: var(--ink); font-weight: 800; font-size: 46px; padding: 22px 42px; border-radius: 999px; }
  .brand { position: absolute; left: 124px; top: 880px; letter-spacing: .42em; font-weight: 600; font-size: 34px; opacity: .9; }
  .glow { position: absolute; left: 1400px; top: 560px; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%; background: radial-gradient(circle, rgba(240,220,174,.26) 0%, rgba(240,220,174,0) 62%); }
  .bottles { position: absolute; left: 1080px; top: 130px; display: flex; align-items: flex-end; }
  .bottles img { height: 820px; filter: drop-shadow(0 34px 34px rgba(0,0,0,.45)); }
  .bottles img.bath { filter: brightness(1.12) contrast(1.03) drop-shadow(0 34px 34px rgba(0,0,0,.45)); margin-left: -40px; }
  .lbl { position: absolute; background: rgba(247,244,236,.97); color: var(--ink); border-radius: 18px; padding: 14px 22px; box-shadow: 0 12px 26px rgba(0,0,0,.28); }
  .lbl b { display: block; font-size: 32px; font-weight: 800; }
  .lbl span { display: block; font-size: 25px; font-weight: 600; color: #34463c; }
  .badge { position: absolute; left: 1570px; top: 90px; width: 290px; height: 290px; border-radius: 50%; background: var(--gold); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 18px 38px rgba(0,0,0,.4); }
  .badge .k { font-size: 28px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .badge .p { font-family: "Fraunces", serif; font-weight: 700; font-size: 106px; line-height: .95; }
  .badge .p small { font-size: .42em; }
  .badge .f { font-size: 28px; font-weight: 800; }
  svg.snow { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="layer bg"></div>
<div class="layer" id="s3">
  <div class="glow"></div>
  <div class="eyebrow" id="eye">Julepakke</div>
  <div class="title" id="title">Julen starter med <em>et rent bad</em></div>
  <div class="save" id="save">Hver for seg 397 kr – <b>spar 48 kr</b></div>
  <div class="cta" id="cta">isokor-skandinavia.no</div>
  <div class="brand" id="brand">ISOKOR</div>
  <div class="bottles"><img id="b1" src="lm.png"><img id="b2" class="bath" src="bath_fix.png"></div>
  <div class="lbl" id="l1" style="left:1010px; top:640px"><b>LM Descaling</b><span>fjerner kalk</span></div>
  <div class="lbl" id="l2" style="left:1560px; top:800px"><b>Bath Cleaner</b><span>baderomsrens</span></div>
  <div class="badge" id="badge"><div class="k">Begge for</div><div class="p">349<small> kr</small></div><div class="f">inkl. frakt</div></div>
</div>
<div id="ph">
  <div class="layer bg"></div>
  <div class="panel">
    <div class="photo" id="p2"><img id="i2" src="in/0b6a2b25-image.jpg" style="object-position:58% 50%"><div class="tag gold">Etter</div></div>
    <div class="photo" id="p1"><img id="i1" src="in/66a6fb1a-image.jpg" style="object-position:62% 55%"><div class="tag">Før</div></div>
  </div>
  <div class="q" id="q1">Kalk på<br><em>dusjdøra?</em></div>
  <div class="q" id="q2">Blank igjen –<br><em>uten harde kjemikalier</em></div>
</div>
<svg class="snow" id="snow" width="1920" height="1080"></svg>
<script>
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
  const seg = (t, a, b) => ease((t - a) / (b - a));
  let s = 11; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const flakes = Array.from({ length: 160 }, () => ({ x: r() * 1920, y: r() * 1080, rad: 1 + r() * 3.2, o: .15 + r() * .45, v: 30 + r() * 55, d: r() * 6.28 }));
  const $ = id => document.getElementById(id);
  const set = (id, o, tf) => { const e = $(id); e.style.opacity = o; if (tf !== undefined) e.style.transform = tf; };
  window.render = (t) => {
    $('i1').style.transform = `scale(${1.08 + t * 0.03})`;
    const q1in = seg(t, .2, .9), q1out = 1 - seg(t, 3.0, 3.5);
    set('q1', q1in * q1out, `translateY(calc(-50% + ${(1 - q1in) * 40}px))`);
    const w = seg(t, 3.0, 3.8);
    $('p1').style.clipPath = `inset(0 ${w * 100}% 0 0)`;
    $('i2').style.transform = `scale(${1.12 - Math.min(t, 6.5) * 0.012})`;
    const q2in = seg(t, 3.7, 4.4);
    set('q2', q2in, `translateY(calc(-50% + ${(1 - q2in) * 40}px))`);
    $('ph').style.opacity = 1 - seg(t, 6.0, 6.8);
    set('eye', seg(t, 6.4, 7.0));
    set('title', seg(t, 6.4, 7.2), `translateY(${(1 - seg(t, 6.4, 7.2)) * 50}px)`);
    set('b1', seg(t, 6.8, 7.6), `translateY(${(1 - seg(t, 6.8, 7.6)) * 160}px)`);
    set('b2', seg(t, 7.0, 7.8), `translateY(${(1 - seg(t, 7.0, 7.8)) * 160}px)`);
    set('l1', seg(t, 7.8, 8.4), `translateX(${(1 - seg(t, 7.8, 8.4)) * -60}px)`);
    set('l2', seg(t, 8.0, 8.6), `translateX(${(1 - seg(t, 8.0, 8.6)) * 60}px)`);
    const bp = seg(t, 8.7, 9.3);
    set('badge', bp, `rotate(-8deg) scale(${0.6 + 0.4 * bp + (t > 9.3 ? Math.max(0, Math.sin((t - 9.3) * 3)) * 0.03 : 0)})`);
    set('save', seg(t, 9.6, 10.2));
    set('cta', seg(t, 10.0, 10.6), `translateY(${(1 - seg(t, 10.0, 10.6)) * 30}px)`);
    set('brand', seg(t, 10.4, 11.0));
    $('snow').innerHTML = flakes.map(p => {
      const y = (p.y + p.v * t) % 1120 - 20, x = p.x + Math.sin(t * .8 + p.d) * 14;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p.rad}" fill="#fff" opacity="${p.o}"/>`;
    }).join('');
  };
  render(0);
</script>
</body>
</html>
